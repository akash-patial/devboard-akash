name: CD

on: 
    workflow_call:

jobs: 
    deploy:
        runs-on: self-hosted
        steps:
            - name: code checkout
              uses: actions/checkout@v7

            - name: Copy Example Env to main envg
              run: cp .env.example .env
            
            - name: Docker Setup login
              uses: docker/login-action@v4
              with:
                    username: ${{ vars.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            - name: Debug Docker permissions
              run: |
                whoami
                id
                ls -l /var/run/docker.sock
                docker context ls
                docker version
                docker ps

            - name: Deploy the containers with Docker Compose
              run: |
               docker compose pull
               docker compose up -d
