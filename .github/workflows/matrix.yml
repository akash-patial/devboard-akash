name: GO linter

on:
    workflow_dispatch:


jobs:
    code-format:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix: 
                go: ['1.22', '1.23', '1.24']
        steps:
           - name: Checkout code
             uses: actions/checkout@v6

           - name: Set up Go
             uses: actions/setup-go@v6
             with:
              go-version: ${{matrix.go}}       # Specify the Go version
              cache: true              # Enable caching of Go modules
              go-version-file: 'go.mod'
              cache-dependency-path: backend/go.sum

           - name: Run Go formatter 
             run : go fmt
             working-directory: backend

           - name: Run Go vet
             run : go vet
             working-directory: backend

           - name: Run test
             run: go test
             working-directory: backend