name: CI

on:
   push:
       branches: [main]

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Frontend Linter
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Install npm packages
              run: npm install
              working-directory: frontend

            - name: Run Linter
              run : npm run lint
              working-directory: frontend

            - name: Run test
              run: npm run test
              working-directory: frontend

            - name: Docker Setup login
              uses: docker/login-action@v4
              with:
                    username: ${{ vars.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}
                    
            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                    context: ./frontend
                    file: ./frontend/Dockerfile
                    push: true
                    tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest

    backend:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v6

          - name: Set up Go
            uses: actions/setup-go@v6
            with:
              go-version: '1.25'       # Specify the Go version
              cache: true              # Enable caching of Go modules
              go-version-file: 'go.mod'
              cache-dependency-path: backend/go.sum

          - name: Run Go formatter
            run : go fmt
            working-directory: backend

          - name: Run Go vet
            run : go vet
            working-directory: backend

          - name: Run test
            run: go test
            working-directory: backend

          - name: Docker Setup login
            uses: docker/login-action@v4
            with:
                    username: ${{ vars.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}
                    
          - name: Build and push Docker image
            uses: docker/build-push-action@v7
            with:
                    context: ./backend
                    file: ./backend/Dockerfile
                    push: true
                    tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-backend:latest

          
             
