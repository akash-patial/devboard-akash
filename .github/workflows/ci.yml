name: CI

on:
   workflow_dispatch: 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
     - name: checkout-code
       uses: actions/checkout@v7

     - name: docker login
     
       uses: docker/login-action@v4
       with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

