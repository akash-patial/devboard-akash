name: CI

on:
   push:
       branches: [main]

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Frontend Linter
              uses: action/setup-node@v6
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Install npm packages
              run: npm install

            - name: Run Linter
              run : npm run lint

            - name: Run test
              run: npm run test
             
